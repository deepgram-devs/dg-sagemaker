[project]
name = "python-voice-agent"
version = "0.1.0"
description = "Deepgram Voice Agent on SageMaker (/v1/agent/converse) example client + e2e"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-sdk-sagemaker-runtime-http2[awscrt]>=0.11,<0.12",  # 0.12+ renamed the async client; the repo's drivers use the 0.11 API
    "boto3>=1.42.34",
]
